name: 🐍 Generate Professional Snake Animation

on:
  schedule:
    # هر روز ساعت 00:00 UTC
    - cron: "0 0 * * *"
    # هر 6 ساعت یک بار
    - cron: "0 */6 * * *"
  
  workflow_dispatch:
  
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    name: 🎮 Generate Professional Snake Animation
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🌟 Create Output Directories
        run: |
          mkdir -p dist
          mkdir -p output
          echo "✅ Output directories created"
      
      - name: 🎨 Generate Snake - GitHub Light Theme
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            output/github-snake.svg?palette=github-light
      
      - name: 🌙 Generate Snake - GitHub Dark Theme
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            output/github-snake-dark.svg?palette=github-dark
      
      - name: 🧛 Generate Snake - Dracula Theme
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-dracula.svg?palette=dracula
            output/github-snake-dracula.svg?palette=dracula
      
      - name: ❄️ Generate Snake - Nord Theme
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake-nord.svg?palette=nord
            output/github-snake-nord.svg?palette=nord
      
      - name: 🔧 Setup Git Configuration
        run: |
          git config --local user.email "github-action@github.com"
          git config --local user.name "🐍 Snake Animation Bot"
      
      - name: 📝 Commit Snake Animations
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain dist/)" ] || [ -n "$(git status --porcelain output/)" ]; then
            echo "🎬 Found changes, committing..."
            git add dist/ output/
            git commit -m "🐍 Update snake animations - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
            git push origin main
            echo "✅ Successfully pushed snake animations!"
          else
            echo "ℹ️ No changes detected"
          fi
      
      - name: 📊 Generate Summary
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║  🐍 Snake Animation Workflow Report   ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "✅ Generated Themes:"
          echo "   • 🌞 GitHub Light"
          echo "   • 🌙 GitHub Dark"
          echo "   • 🧛 Dracula"
          echo "   • ❄️ Nord"
          echo ""
          echo "📁 Files Location:"
          echo "   • dist/ (for main branch)"
          echo "   • output/ (for output branch)"
          echo ""
          echo "⏰ Last Update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "✨ Workflow completed successfully!"
